<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion Wi-Fi</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f5fb;font-family:Arial,Helvetica,sans-serif;color:#1e1b2e}
  .card{background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:28px 22px;width:92%;max-width:360px;text-align:center}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 18px;color:#6b6478;font-size:14px}
  input[type=text]{width:100%;box-sizing:border-box;padding:14px;font-size:20px;letter-spacing:3px;text-align:center;text-transform:uppercase;border:2px solid #e4e1ec;border-radius:10px}
  input[type=text]:focus{outline:none;border-color:#7c3aed}
  button{margin-top:14px;width:100%;padding:14px;font-size:16px;font-weight:bold;color:#fff;background:#7c3aed;border:0;border-radius:10px}
  .err{color:#dc2626;font-size:14px;margin:0 0 12px}
  .help{margin-top:16px;font-size:12px}
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
  <input type="hidden" name="username">
  <input type="hidden" name="password">
  <input type="hidden" name="dst" value="$(link-orig)">
</form>
<script src="/md5.js"></script>
<script>
function doLogin(){
  var c = document.login.code.value.replace(/\s/g,'').toUpperCase();
  if(!c){return false;}
  document.sendin.username.value = c;
  document.sendin.password.value = hexMD5('$(chap-id)' + c + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)
<script>
function plainLogin(){
  var c = document.login.code.value.replace(/\s/g,'').toUpperCase();
  if(!c){return false;}
  document.login.username.value = c;
  document.login.password.value = c;
  return true;
}
</script>
<div class="card">
  <h1>Connexion Wi-Fi</h1>
  <p>Saisissez le code de votre ticket</p>
  $(if error)<div class="err">$(error)</div>$(endif)
  <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onsubmit="return doLogin()" $(else) onsubmit="return plainLogin()" $(endif)>
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="username" value="">
    <input type="hidden" name="password" value="">
    <input name="code" type="text" placeholder="CODE" autocomplete="off" autocapitalize="characters" required>
    <button type="submit">Se connecter</button>
  </form>
  <div class="help">Un seul champ à remplir : le code imprimé sur votre ticket.</div>
</div>
</body>
</html>
