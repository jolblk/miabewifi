<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIABEWIFI - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo-badge">
                <div class="icon">M</div>
                <span>MIABEWIFI</span>
            </div>

            <h1 id="form-heading">Bon retour</h1>
            <h2 id="form-subtitle">Pilotez vos routeurs MikroTik depuis n'importe où.</h2>

            <form id="login-form">
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="login-email" placeholder="Votre email" required>
                </div>

                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" placeholder="Votre mot de passe" required>
                    <div class="icon-right password-toggle" id="toggle-password-visibility">
                        <i data-feather="eye"></i>
                        <i data-feather="eye-off"></i>
                    </div>
                </div>
                <p class="forgot-link"><a href="#" id="forgot-password-link">Mot de passe oublié ?</a></p>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember-me">
                    <label style="margin:0;font-weight:400;">Rester connecté sur cet appareil</label>
                </div>

                <button type="submit">Se connecter</button>
            </form>

            <form id="register-form" style="display:none;">
                <label>Nom</label>
                <div class="input-wrapper">
                    <input type="text" id="register-nom" placeholder="Votre nom" required>
                </div>
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="register-email" placeholder="Votre email" required>
                </div>
                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="register-password" placeholder="Choisissez un mot de passe" required>
                    <div class="icon-right password-toggle" id="toggle-register-password-visibility">
                        <i data-feather="eye"></i>
                        <i data-feather="eye-off"></i>
                    </div>
                </div>
                <button type="submit">Créer un compte</button>
            </form>

            <p id="message"></p>

            <div class="divider">ou</div>
            <p class="footer-text" id="footer-toggle">
                Pas encore de compte ? <a href="#" id="toggle-form">Créer un compte gratuitement →</a>
            </p>
        </div>
    </div>

    <div class="modal-overlay" id="forgot-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Mot de passe oublié</h2>
                <button class="modal-close" id="forgot-modal-close" aria-label="Fermer"><i
                        data-feather="x"></i></button>
            </div>
            <div class="modal-body">
                <p style="font-size:13px; color:var(--text-muted); margin:0 0 16px;">
                    Entrez l'adresse email de votre compte : nous vous enverrons un lien pour choisir un nouveau mot de
                    passe.
                </p>
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="forgot-email" placeholder="Votre email" required>
                </div>
                <button type="button" id="forgot-submit-btn">Envoyer le lien</button>
                <p id="forgot-message"></p>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="app.js"></script>
</body>

</html>
