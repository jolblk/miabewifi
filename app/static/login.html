<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIABEWIFI - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo-badge">
                <div class="icon">M</div>
                <span>MIABEWIFI</span>
            </div>

            <h1 id="form-heading">Bon retour</h1>
            <h2 id="form-subtitle">Pilotez vos routeurs MikroTik depuis n'importe où.</h2>

            <form id="login-form">
                <label>Email</label>
                <div class="input-wrapper">
                    <span class="icon-left">✉</span>
                    <input type="email" id="login-email" placeholder="Votre email" required>
                </div>

                <label>Mot de passe <a href="#" onclick="return false;">Oublié ?</a></label>
                <div class="input-wrapper">
                    <span class="icon-left">🔒</span>
                    <input type="password" id="login-password" placeholder="Votre mot de passe" required>
                    <button type="button" class="icon-right" id="toggle-password-visibility">👁</button>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember-me">
                    <label style="margin:0;font-weight:400;">Rester connecté sur cet appareil</label>
                </div>

                <button type="submit">Se connecter</button>
            </form>

            <form id="register-form" style="display:none;">
                <label>Nom</label>
                <div class="input-wrapper">
                    <span class="icon-left">👤</span>
                    <input type="text" id="register-nom" placeholder="Votre nom" required>
                </div>
                <label>Email</label>
                <div class="input-wrapper">
                    <span class="icon-left">✉</span>
                    <input type="email" id="register-email" placeholder="Votre email" required>
                </div>
                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <span class="icon-left">🔒</span>
                    <input type="password" id="register-password" placeholder="Choisissez un mot de passe" required>
                </div>
                <button type="submit">Créer un compte</button>
            </form>

            <p id="message"></p>

            <div class="divider">ou</div>
            <p class="footer-text" id="footer-toggle">
                Pas encore de compte ? <a href="#" id="toggle-form">Créer un compte gratuitement →</a>
            </p>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
