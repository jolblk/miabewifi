<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIABEWIFI - Nouveau mot de passe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo-badge">
                <div class="icon">M</div>
                <span>MIABEWIFI</span>
            </div>

            <h1>Nouveau mot de passe</h1>
            <h2>Choisissez un nouveau mot de passe pour votre compte.</h2>

            <form id="reset-form">
                <label>Nouveau mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="new-password" placeholder="Nouveau mot de passe" required minlength="6">
                    <div class="icon-right password-toggle" id="toggle-new-password-visibility">
                        <i data-feather="eye"></i>
                        <i data-feather="eye-off"></i>
                    </div>
                </div>

                <label>Confirmer le mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" placeholder="Confirmez le mot de passe" required minlength="6">
                </div>

                <button type="submit">Réinitialiser le mot de passe</button>
            </form>

            <p id="reset-message"></p>
        </div>
    </div>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="reset-password.js"></script>
</body>

</html>
