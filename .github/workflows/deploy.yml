name: Déploiement miabewifi

on:
  push:
    branches:
      - dev-react
      - main

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/dev-react'
    runs-on: ubuntu-latest
    steps:
      - name: Réessayer la connexion en cas d'échec réseau ponctuel
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: nc -z -w5 ${{ secrets.VPS_HOST }} 22
      - name: Réessayer la connexion en cas d'échec réseau ponctuel
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: nc -z -w5 ${{ secrets.VPS_HOST }} 22
      - name: Déployer sur staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60s
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}/staging
            git pull origin dev-react
            docker compose up -d --build

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Réessayer la connexion en cas d'échec réseau ponctuel
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: nc -z -w5 ${{ secrets.VPS_HOST }} 22
      - name: Déployer sur prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60s
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}/prod
            git pull origin main
            docker compose up -d --build